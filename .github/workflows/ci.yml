name: CI

on:
  pull_request:
    paths:
      - "apps/**"
      - "packages/**"
      - "docker/**"
      - ".github/workflows/**"
      - "turbo.json"
      - "package.json"
      - "bun.lock"

  push:
    branches:
      - main
    paths:
      - "apps/**"
      - "packages/**"
      - "docker/**"
      - ".github/workflows/**"
      - "turbo.json"
      - "package.json"
      - "bun.lock"

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  quality:
    name: Lint / Build / Typecheck
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Cache Bun Dependencies
        uses: actions/cache@v4
        with:
          path: |
            ~/.bun/install/cache
            node_modules
            .turbo
          key: ${{ runner.os }}-bun-${{ hashFiles('bun.lock') }}

      - name: Install Dependencies
        run: bun install

      - name: Generate Prisma Client
        env:
          DATABASE_URL: postgresql://postgres:postgres@localhost:5432/hive
        # packages/db/src/generated is gitignored, so the client must be
        # produced before the backend/worker builds that import it. (Runs via
        # the root db:generate script; `bun --cwd <pkg> run <script>` does not
        # reliably resolve scripts in Bun.)
        run: bun run db:generate

      - name: Run Lint
        run: bun run lint

      - name: Run Typecheck
        run: bun run check-types

      - name: Run Build
        run: bun run build

  detect-changes:
    name: Detect Changed Services
    runs-on: ubuntu-latest
    needs: quality

    outputs:
      backend: ${{ steps.filter.outputs.backend }}
      frontend: ${{ steps.filter.outputs.frontend }}
      worker: ${{ steps.filter.outputs.worker }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Detect Changed Files
        id: filter
        shell: bash
        run: |
          if [ "${{ github.event_name }}" = "pull_request" ]; then
            CHANGED_FILES=$(git diff --name-only origin/${{ github.base_ref }}...HEAD)
          else
            CHANGED_FILES=$(git diff --name-only ${{ github.event.before }} ${{ github.sha }})
          fi

          echo "$CHANGED_FILES"

          echo "backend=false" >> $GITHUB_OUTPUT
          echo "frontend=false" >> $GITHUB_OUTPUT
          echo "worker=false" >> $GITHUB_OUTPUT

          mark() {
            local svc="$1"; local flag="$2"
            if [ "$flag" = "true" ]; then
              echo "${svc}=true" >> $GITHUB_OUTPUT
            fi
          }

          # ── apps/ ──
          if echo "$CHANGED_FILES" | grep -q '^apps/backend/'; then mark backend true; fi
          if echo "$CHANGED_FILES" | grep -q '^apps/frontend/'; then mark frontend true; fi
          if echo "$CHANGED_FILES" | grep -q '^apps/worker/'; then mark worker true; fi

          # ── dockerfiles (docker/*.dockerfile) ──
          if echo "$CHANGED_FILES" | grep -q '^docker/backend\.dockerfile$'; then mark backend true; fi
          if echo "$CHANGED_FILES" | grep -q '^docker/frontend\.dockerfile$'; then mark frontend true; fi
          if echo "$CHANGED_FILES" | grep -q '^docker/worker\.dockerfile$'; then mark worker true; fi
          if echo "$CHANGED_FILES" | grep -q '^docker/nginx\.frontend\.conf$'; then mark frontend true; fi

          # ── packages/ — map each package to services that consume it ──
          if echo "$CHANGED_FILES" | grep -q '^packages/db/'; then
            mark backend true; mark worker true
          fi
          if echo "$CHANGED_FILES" | grep -q '^packages/queue/'; then
            mark backend true; mark worker true
          fi
          if echo "$CHANGED_FILES" | grep -q '^packages/events/'; then
            mark backend true; mark worker true
          fi
          if echo "$CHANGED_FILES" | grep -q '^packages/types/'; then
            mark backend true; mark frontend true; mark worker true
          fi
          # packages/ui, packages/eslint-config, packages/typescript-config are
          # not consumed by any service — changes there intentionally skipped.

      - name: Save Changed Services
        run: |
          mkdir -p changed
          echo '${{ steps.filter.outputs.backend }}' > changed/backend
          echo '${{ steps.filter.outputs.frontend }}' > changed/frontend
          echo '${{ steps.filter.outputs.worker }}' > changed/worker

      - name: Upload Changed Services
        uses: actions/upload-artifact@v4
        with:
          name: changed-services
          path: changed/

  test-backend:
    name: Backend Tests
    runs-on: ubuntu-latest
    needs: quality
    timeout-minutes: 20

    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: hive_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    env:
      NODE_ENV: test
      DATABASE_URL: postgresql://postgres:postgres@localhost:5432/hive_test
      ACCESS_TOKEN_SECRET: __ci_only_secret_at_least_32_chars_000000
      GITHUB_CLIENT_ID: ci-client-id
      GITHUB_CLIENT_SECRET: ci-client-secret
      GITHUB_WEBHOOK_SECRET: ci-webhook-secret
      GITHUB_TOKEN_ENCRYPTION_KEY: __ci_encryption_key_00000000
      LIVEKIT_URL: wss://fake.livekit.cloud
      LIVEKIT_API_KEY: ci-livekit-key
      LIVEKIT_API_SECRET: ci-livekit-secret

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Cache Bun Dependencies
        uses: actions/cache@v4
        with:
          path: |
            ~/.bun/install/cache
            node_modules
            .turbo
          key: ${{ runner.os }}-bun-${{ hashFiles('bun.lock') }}

      - name: Install Dependencies
        run: bun install

      - name: Generate Prisma Client
        run: bun run db:generate

      - name: Apply Migrations
        run: bun run db:deploy

      - name: Run Backend Tests
        run: cd apps/backend && bun run test

  docker-build:
    name: Docker Build & Push
    runs-on: ubuntu-latest

    needs:
      - quality
      - detect-changes

    if: |
      github.event_name == 'push' &&
      github.ref == 'refs/heads/main'

    strategy:
      fail-fast: false

      matrix:
        include:
          - service: backend
            dockerfile: docker/backend.dockerfile
            image: hive-backend
            changed: ${{ needs.detect-changes.outputs.backend }}

          - service: frontend
            dockerfile: docker/frontend.dockerfile
            image: hive-frontend
            changed: ${{ needs.detect-changes.outputs.frontend }}

          - service: worker
            dockerfile: docker/worker.dockerfile
            image: hive-worker
            changed: ${{ needs.detect-changes.outputs.worker }}

    steps:
      - name: Checkout
        if: matrix.changed == 'true'
        uses: actions/checkout@v4

      - name: Setup Docker Buildx
        if: matrix.changed == 'true'
        uses: docker/setup-buildx-action@v3

      - name: Login to Docker Hub
        if: matrix.changed == 'true'
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Build and Push
        if: matrix.changed == 'true'
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ${{ matrix.dockerfile }}
          push: true

          tags: |
            ${{ secrets.DOCKERHUB_USERNAME }}/${{ matrix.image }}:latest
            ${{ secrets.DOCKERHUB_USERNAME }}/${{ matrix.image }}:v${{ github.sha }}

          cache-from: type=gha
          cache-to: type=gha,mode=max

  version:
    name: Upload Version Artifact
    runs-on: ubuntu-latest
    needs: docker-build
    if: |
      github.event_name == 'push' &&
      github.ref == 'refs/heads/main'

    steps:
      - name: Save Version
        run: |
          mkdir -p version
          echo "v${{ github.sha }}" > version/version.txt

      - name: Upload Version
        uses: actions/upload-artifact@v4
        with:
          name: version
          path: version/
